<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipment Tracking Portal</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="login-bg">
    <div class="login-card">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#1a56db"/>
          <path d="M8 28L14 16L20 22L26 12L32 20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="32" cy="20" r="3" fill="#60a5fa"/>
        </svg>
        <span class="login-brand">ImportTrack</span>
      </div>

      <h1 class="login-title">Shipment Tracking</h1>
      <p class="login-sub">Enter your credentials to track your shipments</p>

      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="field-group">
          <label for="email">Email / Customer Code</label>
          <input type="text" id="email" placeholder="your@email.com" required autocomplete="username" />
        </div>
        <div class="field-group">
          <label for="pin">PIN / Password</label>
          <input type="password" id="pin" placeholder="••••••" required autocomplete="current-password" />
        </div>
        <div id="loginError" class="login-error hidden">Invalid credentials. Please try again.</div>
        <button type="submit" class="btn-login" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <svg id="loginSpinner" class="spinner hidden" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="3" stroke-dasharray="31.4" stroke-dashoffset="10"/>
          </svg>
        </button>
      </form>

      <p class="login-contact">
        Need access? Contact your import coordinator.
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const spinner = document.getElementById('loginSpinner');
      const errorEl = document.getElementById('loginError');

      errorEl.classList.add('hidden');
      btnText.textContent = 'Signing in…';
      spinner.classList.remove('hidden');
      btn.disabled = true;

      try {
        const url = window.APPS_SCRIPT_URL;
        if (!url || url === 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
          throw new Error('NO_URL');
        }

        const res = await fetch(`${url}?action=login&email=${encodeURIComponent(email)}&pin=${encodeURIComponent(pin)}`);
        const data = await res.json();

        if (data.success) {
          sessionStorage.setItem('customer', JSON.stringify(data.customer));
          window.location.href = 'dashboard.html';
        } else {
          errorEl.textContent = data.message || 'Invalid credentials. Please try again.';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        if (err.message === 'NO_URL') {
          errorEl.textContent = 'Portal not configured yet. Ask your coordinator to set up the Apps Script URL.';
        } else {
          errorEl.textContent = 'Connection error. Please try again.';
          console.error(err);
        }
        errorEl.classList.remove('hidden');
      } finally {
        btnText.textContent = 'Sign In';
        spinner.classList.add('hidden');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
